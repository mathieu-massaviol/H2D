[package]
name = "hal2datacite"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hal2datacite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-stronghold = "2"
sha2 = "0.10"
machine-uid = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_with = "3"
quick-xml = "0.37"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

# Optimize crypto crates in dev builds.
# The Stronghold vault uses age-encryption with scrypt (N=2^19), which is
# unusably slow without compiler optimizations, causing Tauri to hang on
# startup. This targets only the heavy crates to keep incremental build
# times fast for application code.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.iota-crypto]
opt-level = 3

[profile.dev.package.iota_stronghold]
opt-level = 3

[profile.dev.package.stronghold-runtime]
opt-level = 3

[profile.dev.package.stronghold_engine]
opt-level = 3
